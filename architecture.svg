<svg viewBox="0 0 1100 620" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e18" />
      <stop offset="100%" stop-color="#04080e" />
    </linearGradient>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142136" />
      <stop offset="100%" stop-color="#0b1320" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="620" fill="url(#bg)" />

  <!-- Grid pattern overlay -->
  <g opacity="0.08">
    <path d="M0,60 H1100 M0,120 H1100 M0,180 H1100 M0,240 H1100 M0,300 H1100 M0,360 H1100 M0,420 H1100 M0,480 H1100 M0,540 H1100" stroke="#00d4ff" stroke-width="1" />
    <path d="M100,0 V620 M200,0 V620 M300,0 V620 M400,0 V620 M500,0 V620 M600,0 V620 M700,0 V620 M800,0 V620 M900,0 V620 M1000,0 V620" stroke="#00d4ff" stroke-width="1" />
  </g>

  <!-- Title Header -->
  <text x="550" y="50" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="26" fill="#ffffff" letter-spacing="1">
    COASTGUARD AI <tspan fill="#00d4ff">— ZERO-UI SOVEREIGN EMERGENCY GRID</tspan>
  </text>
  <text x="550" y="78" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#88a0bc">
    High-Speed Emergency Life-Saving Pipeline Powered by All 3 Gnani AI Foundation Models
  </text>

  <!-- STAGE 0: DISTRESS CALL INTAKE -->
  <g transform="translate(40, 120)">
    <rect width="180" height="340" rx="10" fill="url(#boxBg)" stroke="#ff4444" stroke-width="1.5" />
    <rect width="180" height="36" rx="10" fill="#ff4444" opacity="0.15" />
    <text x="90" y="24" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="12" fill="#ff4444">01. DISTRESS CALL</text>
    <text x="90" y="80" text-anchor="middle" font-size="34">📞</text>
    <text x="90" y="115" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#ffffff">Boatman in Crisis</text>
    <text x="90" y="135" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#99aacc">2G Phone / Voice Trunk</text>
    <line x1="20" y1="155" x2="160" y2="155" stroke="#253852" stroke-width="1" />
    <text x="20" y="180" font-family="sans-serif" font-size="10.5" fill="#ffaa00">● 85dB Engine Noise</text>
    <text x="20" y="200" font-family="sans-serif" font-size="10.5" fill="#ffaa00">● 35-Knot Squall Winds</text>
    <text x="20" y="220" font-family="sans-serif" font-size="10.5" fill="#ffaa00">● Churning Water Surf</text>
    <text x="20" y="245" font-family="sans-serif" font-size="10" fill="#8899aa">"Bhaiya! Yahan bahaav</text>
    <text x="20" y="260" font-family="sans-serif" font-size="10" fill="#8899aa">bohot tez hai, naav</text>
    <text x="20" y="275" font-family="sans-serif" font-size="10" fill="#8899aa">ulat gayi bachao!"</text>
  </g>

  <!-- ARROW 1 -->
  <path d="M220,290 L245,290" stroke="#00d4ff" stroke-width="2.5" marker-end="url(#arrow)" fill="none" />
  <polygon points="245,286 255,290 245,294" fill="#00d4ff" />

  <!-- STAGE 1: GNANI PRISMA v2.5 -->
  <g transform="translate(255, 120)">
    <rect width="180" height="340" rx="10" fill="url(#boxBg)" stroke="#00d4ff" stroke-width="1.5" />
    <rect width="180" height="36" rx="10" fill="#00d4ff" opacity="0.15" />
    <text x="90" y="24" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="12" fill="#00d4ff">02. GNANI PRISMA v2.5</text>
    <text x="90" y="80" text-anchor="middle" font-size="34">🎙️</text>
    <text x="90" y="115" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#ffffff">Acoustic Shield STT</text>
    <text x="90" y="135" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#00e676">&lt;200ms Telephony Stream</text>
    <line x1="20" y1="155" x2="160" y2="155" stroke="#253852" stroke-width="1" />
    <text x="20" y="180" font-family="sans-serif" font-size="10.5" fill="#00d4ff">● +19.2 dB Noise Gain</text>
    <text x="20" y="200" font-family="sans-serif" font-size="10.5" fill="#00d4ff">● Wind/Wave Stripped</text>
    <text x="20" y="220" font-family="sans-serif" font-size="10.5" fill="#00d4ff">● Telephony Bandpass</text>
    <text x="20" y="245" font-family="sans-serif" font-size="10" fill="#8899aa">Outputs clean text</text>
    <text x="20" y="260" font-family="sans-serif" font-size="10" fill="#8899aa">even from distorted</text>
    <text x="20" y="275" font-family="sans-serif" font-size="10" fill="#8899aa">low-bandwidth 2G audio</text>
  </g>

  <!-- ARROW 2 -->
  <polygon points="435,286 445,290 435,294" fill="#ffaa00" />

  <!-- STAGE 2: GNANI EVON v3.3 -->
  <g transform="translate(445, 120)">
    <rect width="190" height="340" rx="10" fill="url(#boxBg)" stroke="#ffaa00" stroke-width="1.5" />
    <rect width="190" height="36" rx="10" fill="#ffaa00" opacity="0.15" />
    <text x="95" y="24" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="12" fill="#ffaa00">03. GNANI EVON v3.3</text>
    <text x="95" y="80" text-anchor="middle" font-size="34">🧠</text>
    <text x="95" y="115" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#ffffff">Cognitive Reasoning</text>
    <text x="95" y="135" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ffaa00">30B MoE Sovereign LLM</text>
    <line x1="20" y1="155" x2="170" y2="155" stroke="#253852" stroke-width="1" />
    <text x="20" y="180" font-family="sans-serif" font-size="10.5" fill="#ff4444">● Triage: CRITICAL</text>
    <text x="20" y="200" font-family="sans-serif" font-size="10.5" fill="#ffaa00">● Bhojpuri/Hinglish</text>
    <text x="20" y="220" font-family="sans-serif" font-size="10.5" fill="#ffaa00">● Sector / Ghat Isolated</text>
    <text x="20" y="240" font-family="sans-serif" font-size="10.5" fill="#ffaa00">● Risk Count: 3 People</text>
    <text x="20" y="265" font-family="sans-serif" font-size="10" fill="#8899aa">Generates 2-sentence</text>
    <text x="20" y="280" font-family="sans-serif" font-size="10" fill="#8899aa">actionable alert script</text>
  </g>

  <!-- ARROW 3 -->
  <polygon points="635,286 645,290 635,294" fill="#00d4ff" />

  <!-- STAGE 3: GEO-MATCHING ENGINE -->
  <g transform="translate(645, 120)">
    <rect width="180" height="340" rx="10" fill="url(#boxBg)" stroke="#00d4ff" stroke-width="1.5" />
    <rect width="180" height="36" rx="10" fill="#00d4ff" opacity="0.15" />
    <text x="90" y="24" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="12" fill="#00d4ff">04. GEO-MATCHER</text>
    <text x="90" y="80" text-anchor="middle" font-size="34">📍</text>
    <text x="90" y="115" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#ffffff">Spatial Matcher</text>
    <text x="90" y="135" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#99aacc">2.0 km Danger Zone</text>
    <line x1="20" y1="155" x2="160" y2="155" stroke="#253852" stroke-width="1" />
    <text x="20" y="180" font-family="sans-serif" font-size="10.5" fill="#00d4ff">● Haversine Proximity</text>
    <text x="20" y="200" font-family="sans-serif" font-size="10.5" fill="#00d4ff">● Compass Bearings</text>
    <text x="20" y="220" font-family="sans-serif" font-size="10.5" fill="#00d4ff">● Target Registry (0000)</text>
    <text x="20" y="245" font-family="sans-serif" font-size="10" fill="#8899aa">Isolates registered</text>
    <text x="20" y="260" font-family="sans-serif" font-size="10" fill="#8899aa">boats in immediate</text>
    <text x="20" y="275" font-family="sans-serif" font-size="10" fill="#8899aa">peril area</text>
  </g>

  <!-- ARROW 4 -->
  <polygon points="825,286 835,290 825,294" fill="#00e676" />

  <!-- STAGE 4: GNANI TIMBRE v2.5 & DISPATCH -->
  <g transform="translate(835, 120)">
    <rect width="220" height="340" rx="10" fill="url(#boxBg)" stroke="#00e676" stroke-width="1.5" />
    <rect width="220" height="36" rx="10" fill="#00e676" opacity="0.15" />
    <text x="110" y="24" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="12" fill="#00e676">05. GNANI TIMBRE v2.5</text>
    <text x="110" y="80" text-anchor="middle" font-size="34">📢</text>
    <text x="110" y="115" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#ffffff">Flash Voice Dispatch</text>
    <text x="110" y="135" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#00e676">Simultaneous Outbound</text>
    <line x1="20" y1="155" x2="200" y2="155" stroke="#253852" stroke-width="1" />
    <text x="20" y="180" font-family="sans-serif" font-size="10.5" fill="#00e676">● Warm Indic Spoken TTS</text>
    <text x="20" y="200" font-family="sans-serif" font-size="10.5" fill="#00e676">● Hindi, Bengali, Odia, MR</text>
    <text x="20" y="220" font-family="sans-serif" font-size="10.5" fill="#00e676">● Auto-Rings Nearby Boats</text>
    <text x="20" y="245" font-family="sans-serif" font-size="10" fill="#8899aa">"सावधान! नाव संकट में है।</text>
    <text x="20" y="260" font-family="sans-serif" font-size="10" fill="#8899aa">तुरंत अपनी नौका किनारे</text>
    <text x="20" y="275" font-family="sans-serif" font-size="10" fill="#8899aa">लगाएं और बचाव करें!"</text>
  </g>

  <!-- Bottom Summary Badge -->
  <g transform="translate(40, 500)">
    <rect width="1020" height="70" rx="8" fill="#0b1626" stroke="#00d4ff" stroke-width="1" opacity="0.9" />
    <text x="25" y="30" font-family="sans-serif" font-weight="700" font-size="13" fill="#00d4ff">
      KEY COMPETITION ADVANTAGE: 100% COVERAGE OF ALL 3 GNANI AI MODELS
    </text>
    <text x="25" y="52" font-family="sans-serif" font-size="11.5" fill="#99bbdd">
      Prisma v2.5 (Acoustic Shield STT) + Evon v3.3 (Sovereign Reasoning LLM) + Timbre v2.5 (Indic Voice Synthesis) = Maximum Integration Depth.
    </text>
  </g>
</svg>
